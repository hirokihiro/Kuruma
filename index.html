<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仮免トレーニング</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">KARIMEN PRACTICE</p>
          <h1>仮免の学科を、<br />毎日すぐ解ける形に。</h1>
          <p class="hero-text">
            仮免で出やすい論点をベースにしたオリジナル問題を収録。正誤だけで終わらず、理由まで確認できます。
          </p>
          <div class="hero-actions">
            <button id="start-random" class="button button-primary">
              ランダム5問を始める
            </button>
            <button id="reset-progress" class="button button-secondary">
              履歴をリセット
            </button>
          </div>
        </div>
        <section class="hero-card">
          <p class="card-label">進捗</p>
          <div class="stats-grid">
            <article>
              <span id="answered-count" class="stat-value">0</span>
              <span class="stat-label">解答済み</span>
            </article>
            <article>
              <span id="correct-rate" class="stat-value">0%</span>
              <span class="stat-label">正答率</span>
            </article>
            <article>
              <span id="streak-count" class="stat-value">0</span>
              <span class="stat-label">連続正解</span>
            </article>
          </div>
        </section>
      </header>

      <main>
        <section class="toolbar">
          <div class="toolbar-block">
            <label for="category-filter">カテゴリ</label>
            <select id="category-filter">
              <option value="all">すべて</option>
            </select>
          </div>
          <div class="toolbar-block">
            <label for="mode-filter">表示</label>
            <select id="mode-filter">
              <option value="all">全問題</option>
              <option value="incorrect">間違えた問題</option>
              <option value="unanswered">未回答の問題</option>
            </select>
          </div>
          <div class="toolbar-block toolbar-block-wide">
            <label for="search-input">キーワード</label>
            <input
              id="search-input"
              type="search"
              placeholder="例: 徐行 / 信号 / 踏切"
            />
          </div>
        </section>

        <section class="support-panel">
          <div class="support-header">
            <div>
              <p class="panel-label">STUDY SUPPORT</p>
              <h2>内容別と苦手別で解く</h2>
              <p class="panel-text">
                カテゴリごとの理解度を見ながら、苦手分野だけを絞って復習できます。
              </p>
            </div>
            <div class="support-actions">
              <button id="focus-weakness" class="button button-dark">
                苦手だけ表示
              </button>
              <button id="clear-filters" class="button button-secondary">
                絞り込み解除
              </button>
            </div>
          </div>
          <div id="weak-summary" class="weak-summary"></div>
          <div id="category-overview" class="category-overview"></div>
        </section>

        <section class="exam-panel">
          <div>
            <p class="panel-label">EXAM SIMULATION</p>
            <h2>本番風の模試で解く</h2>
            <p class="panel-text">
              1問ずつ進む形式で、制限時間つきの模試として解けます。
            </p>
          </div>
          <button id="start-exam" class="button button-dark">本番モードを開始</button>
        </section>

        <section id="exam-section" class="exam-section hidden" aria-live="polite">
          <div class="exam-header">
            <div>
              <p class="panel-label">EXAM MODE</p>
              <h3 id="exam-title">模試</h3>
            </div>
            <button id="close-exam" class="button button-secondary">
              終了
            </button>
          </div>
          <div id="exam-body"></div>
        </section>

        <section class="question-header">
          <div>
            <p class="panel-label">QUESTION BANK</p>
            <h2>問題一覧</h2>
          </div>
          <p id="question-count" class="question-count">0問</p>
        </section>

        <section id="question-list" class="question-list" aria-live="polite"></section>
      </main>
    </div>

    <template id="question-template">
      <article class="question-card">
        <div class="question-meta">
          <span class="category-badge"></span>
          <span class="question-status">未回答</span>
        </div>
        <h3 class="question-title"></h3>
        <p class="question-text"></p>
        <div class="choices"></div>
        <div class="question-footer">
          <button class="button button-primary answer-button">回答する</button>
          <p class="feedback"></p>
        </div>
        <div class="explanation hidden"></div>
      </article>
    </template>

    <template id="category-card-template">
      <article class="category-card">
        <div class="category-card-head">
          <div>
            <p class="category-card-title"></p>
            <p class="category-card-subtitle"></p>
          </div>
          <div class="category-card-actions">
            <button class="mini-button category-card-button">この内容を解く</button>
            <button class="mini-button category-mini-test-button">10問テスト</button>
          </div>
        </div>
        <div class="category-progress">
          <div class="category-progress-bar">
            <span class="category-progress-fill"></span>
          </div>
          <p class="category-progress-text"></p>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
